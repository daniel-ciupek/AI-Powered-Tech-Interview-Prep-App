version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, php]
    commit-message:
      prefix: chore
      include: scope
    groups:
      laravel:
        patterns:
          - 'laravel/*'
          - 'illuminate/*'
      dev-tools:
        patterns:
          - 'pestphp/*'
          - 'phpstan/*'
          - 'larastan/*'
          - 'laravel/pint'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore
      include: scope
    groups:
      vue:
        patterns:
          - 'vue'
          - '@vue/*'
          - 'vue-i18n'
      inertia:
        patterns:
          - '@inertiajs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      vite:
        patterns:
          - 'vite'
          - 'vite-plugin-*'
          - '@vitejs/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope
