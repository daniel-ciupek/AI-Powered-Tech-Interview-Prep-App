name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Third-party and first-party actions are pinned to commit SHAs to prevent
# supply-chain attacks from malicious tag rewrites. Update via dependabot.

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3']

    services:
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, bcmath, pcov
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure .env for CI
        run: |
          sed -i 's/^APP_ENV=production/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=false/APP_DEBUG=true/' .env
          sed -i 's/^LOG_LEVEL=error/LOG_LEVEL=debug/' .env
          sed -i 's/^SESSION_ENCRYPT=true/SESSION_ENCRYPT=false/' .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
          sed -i '/^DB_CONNECTION=pgsql/a DB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=testing\nDB_USERNAME=sail\nDB_PASSWORD=password' .env
          sed -i 's/CACHE_STORE=database/CACHE_STORE=redis/' .env
          sed -i 's/QUEUE_CONNECTION=database/QUEUE_CONNECTION=redis/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=512M --no-progress

      - name: Run tests (Pest with coverage)
        run: ./vendor/bin/pest --coverage --min=80
        env:
          PCOV_ENABLED: 1

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check + Build
        run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Composer audit
        run: composer audit

      - name: NPM audit
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
