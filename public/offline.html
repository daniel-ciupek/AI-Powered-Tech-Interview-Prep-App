<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4F46E5">
    <title>PrepMind — offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #eef2ff 0%, #ffffff 50%, #fffbeb 100%);
            color: #111827;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #1c1917 100%);
                color: #f3f4f6;
            }
            .card { background: rgba(31, 41, 55, 0.7); border-color: #374151; }
            .muted { color: #9ca3af; }
            .badge { background: #312e81; color: #c7d2fe; }
            button { background: #6366f1; color: #fff; }
            button:hover { background: #818cf8; }
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        h1 {
            font-size: 1.5rem;
            margin: 1rem 0 0.5rem;
            font-weight: 600;
        }
        p { line-height: 1.6; margin: 0.5rem 0; }
        .muted { color: #6b7280; font-size: 0.875rem; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        button {
            margin-top: 1.5rem;
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            background: #4f46e5;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #6366f1; }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            border-radius: 1rem;
            background: linear-gradient(135deg, #4f46e5, #3732a0);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">PM</div>
        <span class="badge" style="margin-top: 1rem;">Brak połączenia</span>
        <h1>Jesteś offline</h1>
        <p class="muted">PrepMind potrzebuje połączenia z internetem, żeby pobrać pytania i rozmawiać z AI.</p>
        <p class="muted">Sprawdź Wi-Fi lub transfer i spróbuj ponownie.</p>
        <button type="button" onclick="window.location.reload()">Spróbuj ponownie</button>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
